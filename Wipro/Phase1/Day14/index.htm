<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bootstrap Example</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <header>
        <nav class="navbar navbar-expand-sm navbar-dark bg-dark" >
            <div class="container-fluid">
              <a class="navbar-brand" href="javascript:void(0)">Company</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                  <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">About Us</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">Our Products</a>
                  </li>
                </ul>
                <form class="d-flex">
                  <input class="form-control me-2" type="text" placeholder="Search">
                  <button class="btn btn-primary" type="button">Search</button>
                </form>
              </div>
            </div>
          </nav>
        </header>
        <section>
            <div class="container-fluid">
                <div class="row" style="height:100vh;">
                    <div class="col-sm-4 bg-light p-0">
                        <form action="" class="form" style="position:absolute; top:85px; width:30%;">
                            <div class="mb-3 mt-3">
                              <label for="email" class="form-label" style="align-content: center;">Email:</label>
                              <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
                            </div>
                            <div class="mb-3">
                              <label for="pwd" class="form-label">Password:</label>
                              <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
                            </div>
                            <div class="form-check mb-3">
                              <label class="form-check-label">
                                <input class="form-check-input" type="checkbox" name="remember"> Remember me
                              </label>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                          </form>
                    </div>
                    <div class="col-sm-8 bg-secondary" style="height:100vh;">
                        <table class="table table-striped" id="table" style="position:relative; top:80px;">
                            <thead>
                              <tr>
                                <th>Username</th>
                                <th>Name</th>
                                <th>Email</th>
                              </tr>
                            </thead>
                            <tbody>
                              <tr>
                                <td>user1</td>
                                <td>User1</td>
                                <td>user1@example.com</td>
                              </tr>
                              <tr>
                                <td>user2</td>
                                <td>User2</td>
                                <td>user2@example.com</td>
                              </tr>
                              <tr>
                                <td>user3</td>
                                <td>User3/td>
                                <td>user3@example.com</td>
                              </tr>
                            </tbody>
                          </table>
                    </div>
                </div>
            </div>
            
        </section>
    </body>
</html>
