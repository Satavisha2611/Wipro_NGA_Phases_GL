<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - TimeTable</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
   <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-flower2" viewBox="0 0 16 16">

            </svg>  Spring Flowers School</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="timetableBtn">TimeTable</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="timetable mt-4" id="timetable">
            <h3 class="text-center">Class TimeTable</h3>
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        
                        <th>Subject</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Mathematics</td><td>8:00 AM - 9:00 AM</td></tr>
                    <tr><td>Science</td><td>9:00 AM - 10:00 AM</td></tr>
                    <tr><td>Social Science</td><td>11:00 AM - 12:00 PM</td></tr>
                    <tr><td>English</td><td>12:00 PM - 1:00 PM</td></tr>
                    <tr><td>Physical Education</td><td>1:00 PM - 2:00 PM</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        document.getElementById("timetableBtn").addEventListener("click", function(event) {
            event.preventDefault();
            document.getElementById("timetable").style.display = "block";
            document.getElementsByClassName("text-center").style.display = "block";
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
